<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Segoe UI',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffd1"/>
      <stop offset="50%" stop-color="#36a2ff"/>
      <stop offset="100%" stop-color="#b76bff"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)" opacity="0.5"/>

  <!-- moving scanline -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#accent)" opacity="0.35">
    <animate attributeName="y" values="0;318;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="120" font-size="22" letter-spacing="8" fill="#5f7290" filter="url(#glow)">DEVELOPER · BUILDER · SHIPPER</text>

  <text x="55" y="215" font-size="92" font-weight="700" fill="url(#accent)" filter="url(#glow)">WANTEDASA</text>

  <rect x="60" y="240" width="220" height="3" fill="url(#accent)">
    <animate attributeName="width" values="160;260;160" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="275" font-size="18" fill="#9fb3d1">games · tools · things for the web — always online</text>

  <circle cx="930" cy="70" r="9" fill="#00ffd1" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="878" y="75" font-size="14" fill="#9fb3d1">LIVE</text>
</svg>
